# Enable MCUboot so the app is built as a signed, dual-slot image that supports
# the BLE OTA update path (see src/ota.c + docs/ble-config-api.md).
#
# nRF54L defaults already give us ED25519 signing and swap-using-move; the mode
# is set explicitly here for clarity. Swap-using-move needs no scratch partition
# and supports revert (the new image self-confirms on boot — see ota_confirm_on_boot()).
#
# NOTE: a default (development) signing key is used. For production set
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE to a real key; the same key must verify both
# the running image and any OTA'd image.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_MOVE=y
