CONFIG_NCS_SAMPLES_DEFAULTS=y

# --- Bluetooth Mesh badge network ---
# Each badge is a self-provisioning mesh node. Messages travel over the mesh
# ADVERTISING bearer (scan + relay flood). There is intentionally NO SIG mesh GATT
# proxy: it advertises a connectable beacon unconditionally and can't be disabled
# at runtime, which would leave the badge connectable when idle. Instead the badge
# is connectable only in config mode (button), and a config-mode badge acts as the
# gateway — badgectl writes vendor-model access payloads to the config service and
# the firmware re-originates them onto the mesh group (mesh_model_send_to_group()).
# See src/MeshNode.cpp, src/mesh_model.c, src/config_gatt.c.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y          # mesh scans for incoming network PDUs
CONFIG_BT_PERIPHERAL=y        # the custom config GATT service (config mode only)
CONFIG_BT_DEVICE_NAME="vibamix"
CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y        # rebroadcast so one injection reaches all badges
# NOTE: deliberately NOT enabling CONFIG_BT_MESH_GATT_PROXY / _PB_GATT (always-on
# connectable advertising) or CONFIG_BT_MESH_DK_PROV — badges self-provision with
# baked-in keys (zero-config) and are connectable only in config mode.

# SAR window sized for chunked ePaper image transfer (~113 B access payload/msg).
CONFIG_BT_MESH_RX_SEG_MAX=10
CONFIG_BT_MESH_TX_SEG_MAX=10
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=2
CONFIG_BT_MESH_MODEL_GROUP_COUNT=2
CONFIG_BT_MESH_MODEL_KEY_COUNT=1

# Persistence on RRAM via ZMS (nRF54L15 uses ZMS, not NVS).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_NVS=n
CONFIG_SETTINGS_ZMS_CUSTOM_SECTOR_COUNT=y
CONFIG_SETTINGS_ZMS_SECTOR_COUNT=16
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y
CONFIG_BT_SETTINGS=y          # persist mesh seq/RPL/IV across reboots

# Deterministic unicast address derived from the FICR device id.
CONFIG_HWINFO=y

# Battery-voltage ADC (SAADC on AIN7) — see src/battery.c.
CONFIG_ADC=y

# --- Config mode: button-triggered QR + Web Bluetooth onboarding ---
# Per-device GAP name "vibamix-XXXX" so a browser can pick this exact badge; the
# config-mode fast advertiser carries it in its scan response. See src/ConfigMode.cpp.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=28
CONFIG_BT_MAX_CONN=2
# A dedicated fast connectable advertiser during config mode (config service UUID +
# name in the primary AD, ~100 ms) so a laptop finds the badge instantly. The mesh
# stack already reserves 4 ext-adv sets here (main + 2 relay + separate-GATT); add
# one for ours. See start_fast_adv() in src/ConfigMode.cpp.
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=5
# Fast GATT image upload: large ATT MTU + LL data length so a draw uploads quickly.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=5120

CONFIG_CPP=y

CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_LED_STRIP=y

# CONFIG_SERIAL=y
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y

# Deep sleep (System OFF) after the boot LED animation — see main.cpp.
CONFIG_POWEROFF=y

# --- Custom direct-XIP OTA (no MCUboot; see firmware/bootloader/ + src/ota.c) ---
# The app is linked into a slot via the DT code-partition; OTA writes the other
# slot raw via flash_area and a CRC trailer, then reboots into the bootloader.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y   # the app feeds wdt31 (armed by the bootloader) to signal a valid boot
