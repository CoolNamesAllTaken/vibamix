CONFIG_NCS_SAMPLES_DEFAULTS=y

# --- Bluetooth Mesh badge network ---
# Each badge is a self-provisioning mesh node. A phone connects to the nearest
# badge over the Mesh GATT Proxy and injects vendor-model messages; relay floods
# them across the whole mesh. See src/MeshNode.cpp and src/mesh_model.c.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y          # mesh scans for incoming network PDUs
CONFIG_BT_PERIPHERAL=y        # required by the GATT Proxy / PB-GATT bearer
CONFIG_BT_DEVICE_NAME="vibamix"
CONFIG_BT_MESH=y
CONFIG_BT_MESH_RELAY=y        # rebroadcast so one injection reaches all badges
CONFIG_BT_MESH_GATT_PROXY=y   # phone/laptop injects over GATT
CONFIG_BT_MESH_PB_GATT=y      # advertise the proxy/provisioning GATT service
# NOTE: deliberately NOT enabling CONFIG_BT_MESH_DK_PROV — badges self-provision
# with baked-in keys (zero-config), they are never commissioned over PB-ADV.

# SAR window sized for chunked ePaper image transfer (~113 B access payload/msg).
CONFIG_BT_MESH_RX_SEG_MAX=10
CONFIG_BT_MESH_TX_SEG_MAX=10
CONFIG_BT_MESH_RX_SEG_MSG_COUNT=2
CONFIG_BT_MESH_MODEL_GROUP_COUNT=2
CONFIG_BT_MESH_MODEL_KEY_COUNT=1

# Persistence on RRAM via ZMS (nRF54L15 uses ZMS, not NVS).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_ZMS=y
CONFIG_NVS=n
CONFIG_SETTINGS_ZMS_CUSTOM_SECTOR_COUNT=y
CONFIG_SETTINGS_ZMS_SECTOR_COUNT=8
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y
CONFIG_BT_SETTINGS=y          # persist mesh seq/RPL/IV across reboots

# Deterministic unicast address derived from the FICR device id.
CONFIG_HWINFO=y

# Battery-voltage ADC (SAADC on AIN7) — see src/battery.c.
CONFIG_ADC=y

# --- Config mode: button-triggered QR + Web Bluetooth onboarding ---
# Per-device GAP name "vibamix-XXXX" so a browser can pick this exact badge; the
# mesh proxy advertising carries it in its scan response. See src/ConfigMode.cpp.
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=28
CONFIG_BT_MESH_PROXY_USE_DEVICE_NAME=y
# Allow the mesh proxy and the config browser to be connected at once.
CONFIG_BT_MAX_CONN=2
# Fast GATT image upload: large ATT MTU + LL data length so a draw uploads quickly.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_BT_RX_STACK_SIZE=5120

CONFIG_CPP=y

CONFIG_SPI=y
CONFIG_LED_STRIP=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_LED_STRIP=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Deep sleep (System OFF) after the boot LED animation — see main.cpp.
CONFIG_POWEROFF=y
