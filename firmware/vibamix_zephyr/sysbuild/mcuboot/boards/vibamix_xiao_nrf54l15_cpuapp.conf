# MCUboot image config for the vibamix_xiao board (merged by sysbuild).
#
# FPROTECT can't protect the bootloader region on this nRF54L RRAM layout
# ("Can not FPROTECT region that big") — disable it, matching Nordic's nRF54L15
# reference. Each 600K slot is 150 erase sectors (600K / 4K), above the default
# BOOT_MAX_IMG_SECTORS of 128, so raise it.
CONFIG_FPROTECT=n
CONFIG_BOOT_MAX_IMG_SECTORS=256
