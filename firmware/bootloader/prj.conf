# Vibamix first-stage bootloader — minimal, fits in the 48K bootloader_partition.

# Link into the partition selected by the DT chosen code-partition (app.overlay
# points it at bootloader_partition).
CONFIG_USE_DT_CODE_PARTITION=y

# Raw flash access for bl_state (the slots themselves are read via XIP pointers).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_CRC=y

# Watchdog: armed before chain-loading a trial image so a hung boot resets + reverts.
CONFIG_WATCHDOG=y

# Bring-up console (UART). Cheap to keep; aids debugging the boot decision.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y

# Keep it small and self-contained: no BT/mesh/C++, no shell/logging subsystem.
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LOG=n
CONFIG_BT=n
CONFIG_GPIO=y
CONFIG_BOOT_BANNER=n
