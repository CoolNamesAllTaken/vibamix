[tool.poetry]
name = "flashtool"
version = "0.1.0"
description = "Concurrent multi-device USB flashing tool for vibamix boards"
authors = ["aymzhang"]
readme = "README.md"

# System dependencies (not installable via Poetry):
#   libusb   — required by pyusb
#              Debian/Ubuntu: sudo apt install libusb-1.0-0
#              macOS:         brew install libusb
# PyQt6 ships the Qt runtime in its wheel, so no system Qt/tkinter is needed.

[tool.poetry.dependencies]
python = "^3.10"
pyqt6 = "^6.7"
pyusb = "^1.3.1"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
